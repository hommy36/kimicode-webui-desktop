<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Kimi Code WebUI Desktop</title>
    <script>
      // 主题跟随 WebUI：Rust 侧把 WebUI 的主题写进 data-theme 和 localStorage，
      // 这里在加载时先读上次的值，避免闪烁
      const t = localStorage.getItem("ui-theme");
      if (t) document.documentElement.dataset.theme = t;
    </script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #1a1b1e;
        --fg: #d4d4d4;
        --muted: #9a9a9a;
        --border: #2c2d31;
        --hover: #3c3d42;
        --btn2: #3c3d42;
        --btn2-hover: #4a4b51;
        --winbtn: #b0b0b0;
        --accent: #1a88ff;
        --accent-hover: #0f76e8;
        --disabled-bg: #3c3c3c;
        --disabled-fg: #8a8a8a;
        --danger-bg: #7a3535;
        --danger-fg: #f0928e;
      }
      @media (prefers-color-scheme: light) {
        :root:not([data-theme="dark"]) {
          color-scheme: light;
          --bg: #eceef0;
          --fg: #1f2329;
          --muted: #646a73;
          --border: #dee0e3;
          --hover: #e5e6eb;
          --btn2: #d8dbe0;
          --btn2-hover: #c9cdd4;
          --winbtn: #646a73;
          --disabled-bg: #eceef0;
          --disabled-fg: #8f959e;
          --danger-bg: #f5c6c2;
          --danger-fg: #a93226;
        }
      }
      :root[data-theme="light"] {
        color-scheme: light;
        --bg: #eceef0;
        --fg: #1f2329;
        --muted: #646a73;
        --border: #dee0e3;
        --hover: #e5e6eb;
        --btn2: #d8dbe0;
        --btn2-hover: #c9cdd4;
        --winbtn: #646a73;
        --disabled-bg: #eceef0;
        --disabled-fg: #8f959e;
        --danger-bg: #f5c6c2;
        --danger-fg: #a93226;
      }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: stretch;
        background: var(--bg);
        color: var(--fg);
        font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        user-select: none;
        overflow: hidden;
        border-bottom: 1px solid var(--border);
        box-sizing: border-box;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-left: 14px;
        font-size: 13px;
        font-weight: 600;
      }
      .brand img {
        width: 22px;
        height: 22px;
      }
      /* 亮色主题换白眼睛图标 */
      .logo-light {
        display: none;
      }
      @media (prefers-color-scheme: light) {
        :root:not([data-theme="dark"]) .logo-dark {
          display: none;
        }
        :root:not([data-theme="dark"]) .logo-light {
          display: block;
        }
      }
      :root[data-theme="light"] .logo-dark {
        display: none;
      }
      :root[data-theme="light"] .logo-light {
        display: block;
      }
      .spacer {
        flex: 1;
      }
      .vers {
        display: flex;
        align-items: center;
      }
      .ver {
        font-size: 12px;
        color: var(--muted);
        margin-right: 12px;
        white-space: nowrap;
      }
      .ver b {
        color: var(--fg);
        font-weight: 600;
      }
      #btn,
      #remoteBtn {
        align-self: center;
        margin-right: 8px;
        padding: 4px 12px;
        font-size: 12px;
        color: #fff;
        background: var(--accent);
        border: none;
        border-radius: 5px;
        cursor: pointer;
        white-space: nowrap;
      }
      #btn:hover:not(:disabled) {
        background: var(--accent-hover);
      }
      #btn:disabled {
        background: var(--disabled-bg);
        color: var(--disabled-fg);
        cursor: default;
      }
      #remoteBtn {
        background: var(--btn2);
        color: var(--fg);
      }
      #remoteBtn:hover {
        background: var(--btn2-hover);
      }
      #btn.err {
        background: var(--danger-bg);
        color: var(--danger-fg);
      }
      /* 窗口控制按钮 */
      .winbtns {
        display: flex;
        align-items: stretch;
      }
      .winbtn {
        width: 46px;
        border: none;
        background: transparent;
        color: var(--winbtn);
        font-size: 12px;
        font-family: "Segoe MDL2 Assets", "Segoe UI Symbol", sans-serif;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .winbtn:hover {
        background: var(--hover);
      }
      .winbtn.close:hover {
        background: #e81123;
        color: #fff;
        /* 贴齐无边框窗口右上角的圆角 */
        border-top-right-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="brand" data-tauri-drag-region>
      <img class="logo-dark" src="logo.png" alt="" data-tauri-drag-region /><img class="logo-light" src="logo-light.png" alt="" data-tauri-drag-region /><span data-tauri-drag-region>Kimi Code WebUI Desktop</span>
    </div>
    <div class="spacer" data-tauri-drag-region></div>
    <div class="vers" data-tauri-drag-region>
      <span class="ver" data-tauri-drag-region><span id="curLabel" data-tauri-drag-region>当前</span> <b id="cur" data-tauri-drag-region>…</b></span>
      <span class="ver" data-tauri-drag-region><span id="latLabel" data-tauri-drag-region>最新</span> <b id="lat" data-tauri-drag-region>…</b></span>
    </div>
    <button id="btn" disabled>检查中…</button>
    <button id="remoteBtn" title="远程控制">远程</button>
    <div class="winbtns">
      <button class="winbtn" id="minBtn" title="最小化">&#xE921;</button>
      <button class="winbtn" id="maxBtn" title="最大化/还原">&#xE922;</button>
      <button class="winbtn close" id="closeBtn" title="关闭">&#xE8BB;</button>
    </div>
    <script>
      const { invoke } = window.__TAURI__.core;
      const appWindow = window.__TAURI__.window.getCurrentWindow();
      const $ = (id) => document.getElementById(id);

      // 界面语言跟随系统语言（仅中/英）
      const zh = (navigator.language || "en").toLowerCase().startsWith("zh");
      document.documentElement.lang = zh ? "zh-CN" : "en";
      const T = zh
        ? {
            current: "当前",
            latest: "最新",
            checking: "检查中…",
            retry: "重试",
            uptodate: "已是最新",
            updating: "更新中…",
            updateFailed: "更新失败，重试",
            notInstalled: "未安装",
            unknown: "未知",
            remote: "远程",
            minimize: "最小化",
            maximize: "最大化/还原",
            close: "关闭",
          }
        : {
            current: "Current",
            latest: "Latest",
            checking: "Checking…",
            retry: "Retry",
            uptodate: "Up to date",
            updating: "Updating…",
            updateFailed: "Update failed, retry",
            notInstalled: "Not installed",
            unknown: "Unknown",
            remote: "Remote",
            minimize: "Minimize",
            maximize: "Maximize/Restore",
            close: "Close",
          };
      const updateTo = (v) => (zh ? "更新到 v" + v : "Update to v" + v);

      // 窗口控制
      $("minBtn").onclick = () => appWindow.minimize();
      $("maxBtn").onclick = () => appWindow.toggleMaximize();
      $("closeBtn").onclick = () => appWindow.close();
      // 远程控制设置页
      $("remoteBtn").onclick = () => invoke("show_remote_page");

      async function refresh() {
        const btn = $("btn");
        btn.className = "";
        btn.disabled = true;
        btn.textContent = T.checking;
        btn.onclick = null;
        let info;
        try {
          info = await invoke("get_version_info");
        } catch (e) {
          $("cur").textContent = "?";
          $("lat").textContent = "?";
          btn.textContent = T.retry;
          btn.disabled = false;
          btn.onclick = refresh;
          return;
        }
        $("cur").textContent = info.current ? "v" + info.current : T.notInstalled;
        $("lat").textContent = info.latest ? "v" + info.latest : T.unknown;
        if (!info.current) {
          btn.style.display = "none"; // 未安装时安装走内容区安装界面
          return;
        }
        btn.style.display = "";
        if (!info.latest) {
          btn.textContent = T.retry;
          btn.disabled = false;
          btn.onclick = refresh;
          return;
        }
        if (info.current === info.latest) {
          btn.textContent = T.uptodate;
          btn.disabled = true;
          return;
        }
        btn.textContent = updateTo(info.latest);
        btn.disabled = false;
        btn.onclick = doUpdate;
      }

      async function doUpdate() {
        const btn = $("btn");
        btn.disabled = true;
        btn.textContent = T.updating;
        try {
          await invoke("do_update");
          await refresh();
        } catch (e) {
          btn.className = "err";
          btn.textContent = T.updateFailed;
          btn.disabled = false;
          btn.onclick = doUpdate;
          console.error(e);
        }
      }

      window.addEventListener("DOMContentLoaded", () => {
        document.title = "Kimi Code WebUI Desktop";
        $("curLabel").textContent = T.current;
        $("latLabel").textContent = T.latest;
        $("remoteBtn").textContent = T.remote;
        $("remoteBtn").title = T.remote;
        $("minBtn").title = T.minimize;
        $("maxBtn").title = T.maximize;
        $("closeBtn").title = T.close;
        refresh();
      });
    </script>
  </body>
</html>

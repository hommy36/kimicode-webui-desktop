<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Kimi Code WebUI Desktop</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: stretch;
        background: #1a1b1e;
        color: #d4d4d4;
        font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        user-select: none;
        overflow: hidden;
        border-bottom: 1px solid #2c2d31;
        box-sizing: border-box;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-left: 14px;
        font-size: 13px;
        font-weight: 600;
      }
      .brand img {
        width: 22px;
        height: 22px;
      }
      .spacer {
        flex: 1;
      }
      .vers {
        display: flex;
        align-items: center;
      }
      .ver {
        font-size: 12px;
        color: #9a9a9a;
        margin-right: 12px;
        white-space: nowrap;
      }
      .ver b {
        color: #d4d4d4;
        font-weight: 600;
      }
      #btn {
        align-self: center;
        margin-right: 8px;
        padding: 4px 12px;
        font-size: 12px;
        color: #fff;
        background: #2b6cb0;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        white-space: nowrap;
      }
      #btn:hover:not(:disabled) {
        background: #3182ce;
      }
      #btn:disabled {
        background: #3c3c3c;
        color: #8a8a8a;
        cursor: default;
      }
      #btn.err {
        background: #7a3535;
        color: #f0928e;
      }
      /* 窗口控制按钮 */
      .winbtns {
        display: flex;
        align-items: stretch;
      }
      .winbtn {
        width: 46px;
        border: none;
        background: transparent;
        color: #b0b0b0;
        font-size: 12px;
        font-family: "Segoe MDL2 Assets", "Segoe UI Symbol", sans-serif;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .winbtn:hover {
        background: #3c3d42;
      }
      .winbtn.close:hover {
        background: #e81123;
        color: #fff;
        /* 贴齐无边框窗口右上角的圆角 */
        border-top-right-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="brand" data-tauri-drag-region>
      <img src="logo.png" alt="" data-tauri-drag-region /><span data-tauri-drag-region>Kimi Code WebUI Desktop</span>
    </div>
    <div class="spacer" data-tauri-drag-region></div>
    <div class="vers" data-tauri-drag-region>
      <span class="ver" data-tauri-drag-region><span id="curLabel" data-tauri-drag-region>当前</span> <b id="cur" data-tauri-drag-region>…</b></span>
      <span class="ver" data-tauri-drag-region><span id="latLabel" data-tauri-drag-region>最新</span> <b id="lat" data-tauri-drag-region>…</b></span>
    </div>
    <button id="btn" disabled>检查中…</button>
    <div class="winbtns">
      <button class="winbtn" id="minBtn" title="最小化">&#xE921;</button>
      <button class="winbtn" id="maxBtn" title="最大化/还原">&#xE922;</button>
      <button class="winbtn close" id="closeBtn" title="关闭">&#xE8BB;</button>
    </div>
    <script>
      const { invoke } = window.__TAURI__.core;
      const appWindow = window.__TAURI__.window.getCurrentWindow();
      const $ = (id) => document.getElementById(id);

      // 界面语言跟随系统语言（仅中/英）
      const zh = (navigator.language || "en").toLowerCase().startsWith("zh");
      document.documentElement.lang = zh ? "zh-CN" : "en";
      const T = zh
        ? {
            current: "当前",
            latest: "最新",
            checking: "检查中…",
            retry: "重试",
            uptodate: "已是最新",
            updating: "更新中…",
            updateFailed: "更新失败，重试",
            notInstalled: "未安装",
            unknown: "未知",
            minimize: "最小化",
            maximize: "最大化/还原",
            close: "关闭",
          }
        : {
            current: "Current",
            latest: "Latest",
            checking: "Checking…",
            retry: "Retry",
            uptodate: "Up to date",
            updating: "Updating…",
            updateFailed: "Update failed, retry",
            notInstalled: "Not installed",
            unknown: "Unknown",
            minimize: "Minimize",
            maximize: "Maximize/Restore",
            close: "Close",
          };
      const updateTo = (v) => (zh ? "更新到 v" + v : "Update to v" + v);

      // 窗口控制
      $("minBtn").onclick = () => appWindow.minimize();
      $("maxBtn").onclick = () => appWindow.toggleMaximize();
      $("closeBtn").onclick = () => appWindow.close();

      async function refresh() {
        const btn = $("btn");
        btn.className = "";
        btn.disabled = true;
        btn.textContent = T.checking;
        btn.onclick = null;
        let info;
        try {
          info = await invoke("get_version_info");
        } catch (e) {
          $("cur").textContent = "?";
          $("lat").textContent = "?";
          btn.textContent = T.retry;
          btn.disabled = false;
          btn.onclick = refresh;
          return;
        }
        $("cur").textContent = info.current ? "v" + info.current : T.notInstalled;
        $("lat").textContent = info.latest ? "v" + info.latest : T.unknown;
        if (!info.current) {
          btn.style.display = "none"; // 未安装时安装走内容区安装界面
          return;
        }
        btn.style.display = "";
        if (!info.latest) {
          btn.textContent = T.retry;
          btn.disabled = false;
          btn.onclick = refresh;
          return;
        }
        if (info.current === info.latest) {
          btn.textContent = T.uptodate;
          btn.disabled = true;
          return;
        }
        btn.textContent = updateTo(info.latest);
        btn.disabled = false;
        btn.onclick = doUpdate;
      }

      async function doUpdate() {
        const btn = $("btn");
        btn.disabled = true;
        btn.textContent = T.updating;
        try {
          await invoke("do_update");
          await refresh();
        } catch (e) {
          btn.className = "err";
          btn.textContent = T.updateFailed;
          btn.disabled = false;
          btn.onclick = doUpdate;
          console.error(e);
        }
      }

      window.addEventListener("DOMContentLoaded", () => {
        document.title = "Kimi Code WebUI Desktop";
        $("curLabel").textContent = T.current;
        $("latLabel").textContent = T.latest;
        $("minBtn").title = T.minimize;
        $("maxBtn").title = T.maximize;
        $("closeBtn").title = T.close;
        refresh();
      });
    </script>
  </body>
</html>

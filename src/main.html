<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kimi Code</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        background: #1a1b1e;
        color: #d4d4d4;
        user-select: none;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid #3c3c3c;
        border-top-color: #4f9cf9;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        margin-bottom: 18px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #status {
        font-size: 14px;
        color: #9a9a9a;
      }
      #error {
        display: none;
        margin-top: 16px;
        max-width: 80%;
        padding: 12px 16px;
        border: 1px solid #7a3535;
        border-radius: 6px;
        background: #2d1f1f;
        color: #f0928e;
        font-size: 13px;
        white-space: pre-wrap;
        word-break: break-all;
      }
      #install {
        display: none;
        flex-direction: column;
        align-items: center;
        max-width: 420px;
        text-align: center;
      }
      #install h2 {
        margin: 0 0 10px;
        font-size: 18px;
      }
      #install p {
        margin: 0 0 20px;
        font-size: 13px;
        color: #9a9a9a;
        line-height: 1.6;
      }
      #installBtn {
        padding: 8px 24px;
        font-size: 14px;
        color: #fff;
        background: #2b6cb0;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      #installBtn:hover:not(:disabled) {
        background: #3182ce;
      }
      #installBtn:disabled {
        background: #3c3c3c;
        color: #8a8a8a;
        cursor: default;
      }
      #installMsg {
        margin-top: 14px;
        font-size: 12px;
        color: #9a9a9a;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div id="loading" style="display: flex; flex-direction: column; align-items: center">
      <div class="spinner" id="spinner"></div>
      <div id="status">正在连接 Kimi Code 服务…</div>
    </div>
    <div id="error"></div>
    <div id="install">
      <h2 id="installTitle">未检测到 Kimi Code CLI</h2>
      <p id="installDesc">
        本应用需要本机安装 Kimi Code CLI（kimi）才能运行。<br />
        点击下方按钮将通过官方安装脚本自动安装。
      </p>
      <button id="installBtn">安装 Kimi Code</button>
      <div id="installMsg"></div>
    </div>
    <script>
      const { invoke } = window.__TAURI__.core;
      const $ = (id) => document.getElementById(id);

      // 界面语言跟随系统语言（仅中/英）
      const zh = (navigator.language || "en").toLowerCase().startsWith("zh");
      document.documentElement.lang = zh ? "zh-CN" : "en";
      const T = zh
        ? {
            connecting: "正在连接 Kimi Code 服务…",
            starting: "正在启动 Kimi Code 服务…",
            waiting: "等待服务就绪…",
            updating: "正在更新 Kimi Code CLI（服务将短暂中断）…",
            errorTitle: "出错了",
            installTitle: "未检测到 Kimi Code CLI",
            installDesc:
              "本应用需要本机安装 Kimi Code CLI（kimi）才能运行。<br />点击下方按钮将通过官方安装脚本自动安装。",
            installBtn: "安装 Kimi Code",
            installing: "正在安装…（需下载约 150MB，可能需要几分钟，请勿关闭窗口）",
            installDone: "安装完成，正在启动…",
            installFailed: "安装失败：",
            err: {
              no_cli: "未检测到 Kimi Code CLI",
              install_verify_failed: "安装脚本已执行，但仍未找到 kimi，请重启应用或到官网手动安装",
              cmd_failed: "命令执行失败",
              no_home: "无法确定用户主目录（USERPROFILE/HOME 均未设置）",
              no_port: "分配本地端口失败",
              spawn_failed: "启动 kimi web 失败",
              server_exited: "kimi web 进程异常退出",
              token_timeout: "等待服务 token 生成超时",
              ready_timeout: "等待服务就绪超时",
              no_webview: "content webview 不存在",
              nav_failed: "导航到 WebUI 失败",
              update_verify: "更新完成，但读取新版本号失败",
            },
          }
        : {
            connecting: "Connecting to Kimi Code service…",
            starting: "Starting Kimi Code service…",
            waiting: "Waiting for the service to be ready…",
            updating: "Updating Kimi Code CLI (service will be briefly unavailable)…",
            errorTitle: "Something went wrong",
            installTitle: "Kimi Code CLI not detected",
            installDesc:
              "This app requires the Kimi Code CLI (kimi) installed on this machine.<br />Click the button below to install it via the official install script.",
            installBtn: "Install Kimi Code",
            installing: "Installing… (about 150MB to download; this may take a few minutes — do not close the window)",
            installDone: "Installation complete, starting…",
            installFailed: "Installation failed: ",
            err: {
              no_cli: "Kimi Code CLI not detected",
              install_verify_failed: "The install script ran, but kimi was still not found. Please restart the app or install it manually from the official site",
              cmd_failed: "Command failed",
              no_home: "Cannot determine the user home directory (neither USERPROFILE nor HOME is set)",
              no_port: "Failed to allocate a local port",
              spawn_failed: "Failed to start kimi web",
              server_exited: "The kimi web process exited unexpectedly",
              token_timeout: "Timed out waiting for the service token",
              ready_timeout: "Timed out waiting for the service to be ready",
              no_webview: "The content webview does not exist",
              nav_failed: "Failed to navigate to the WebUI",
              update_verify: "Update finished, but reading the new version failed",
            },
          };

      // 静态文案
      document.title = "Kimi Code WebUI Desktop";
      $("status").textContent = T.connecting;
      $("installTitle").textContent = T.installTitle;
      $("installDesc").innerHTML = T.installDesc;
      $("installBtn").textContent = T.installBtn;

      // Rust 端调用：显示加载状态（key 由前端按系统语言翻译）
      window.showStatus = function (key) {
        $("install").style.display = "none";
        $("loading").style.display = "flex";
        $("spinner").style.display = "block";
        $("error").style.display = "none";
        $("status").textContent = T[key] || key;
      };
      // Rust 端调用：显示错误（key 由前端翻译，detail 为原始技术细节）
      window.showError = function (key, detail) {
        $("install").style.display = "none";
        $("loading").style.display = "flex";
        $("spinner").style.display = "none";
        $("status").textContent = T.errorTitle;
        $("error").style.display = "block";
        $("error").textContent = (T.err[key] || key) + (detail ? "\n" + detail : "");
      };
      // Rust 端调用：进入安装界面
      window.showInstall = function () {
        $("loading").style.display = "none";
        $("error").style.display = "none";
        $("install").style.display = "flex";
      };

      $("installBtn").onclick = async function () {
        const btn = $("installBtn");
        btn.disabled = true;
        $("installMsg").textContent = T.installing;
        try {
          await invoke("install_kimi");
          $("installMsg").textContent = T.installDone;
        } catch (e) {
          btn.disabled = false;
          const [k, d] = String(e).split("|");
          $("installMsg").textContent =
            T.installFailed + (T.err[k] || k) + (d ? " (" + d + ")" : "");
        }
      };
    </script>
  </body>
</html>

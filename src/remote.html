<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kimi Code WebUI Desktop</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        background: #1a1b1e;
        color: #d4d4d4;
        user-select: none;
      }
      #panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        max-width: 460px;
        text-align: center;
      }
      h2 {
        margin: 0 0 18px;
        font-size: 18px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
        font-size: 14px;
      }
      /* 开关 */
      .switch {
        position: relative;
        width: 40px;
        height: 22px;
        appearance: none;
        background: #3c3c3c;
        border-radius: 11px;
        cursor: pointer;
        transition: background 0.15s;
        outline: none;
        flex: none;
      }
      .switch:checked {
        background: #2b6cb0;
      }
      .switch:disabled {
        cursor: default;
        opacity: 0.5;
      }
      .switch::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 16px;
        height: 16px;
        background: #d4d4d4;
        border-radius: 50%;
        transition: left 0.15s;
      }
      .switch:checked::after {
        left: 21px;
      }
      #status {
        font-size: 13px;
        color: #9a9a9a;
        margin-bottom: 16px;
      }
      #remoteInfo {
        display: none;
        flex-direction: column;
        align-items: center;
      }
      #qr {
        background: #fff;
        border-radius: 8px;
        padding: 10px;
        line-height: 0;
        margin-bottom: 12px;
      }
      #urlRow {
        display: flex;
        align-items: center;
        gap: 8px;
        max-width: 440px;
        margin-bottom: 16px;
      }
      #url {
        font-size: 12px;
        color: #9a9a9a;
        background: #232428;
        border: 1px solid #2c2d31;
        border-radius: 5px;
        padding: 6px 10px;
        word-break: break-all;
        user-select: text;
        text-align: left;
      }
      .btn {
        padding: 6px 16px;
        font-size: 13px;
        color: #fff;
        background: #2b6cb0;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        white-space: nowrap;
        flex: none;
      }
      .btn:hover:not(:disabled) {
        background: #3182ce;
      }
      .btn:disabled {
        background: #3c3c3c;
        color: #8a8a8a;
        cursor: default;
      }
      .btn.secondary {
        background: #3c3d42;
        color: #d4d4d4;
      }
      .btn.secondary:hover {
        background: #4a4b51;
      }
      #hint {
        font-size: 12px;
        color: #8a8a8a;
        line-height: 1.7;
        margin-bottom: 22px;
      }
      #err {
        font-size: 12px;
        color: #f0928e;
        margin-bottom: 12px;
        white-space: pre-wrap;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div id="panel">
      <h2 id="title">远程控制（局域网）</h2>
      <div class="row">
        <input type="checkbox" id="toggle" class="switch" />
        <label for="toggle" id="toggleLabel">启用远程访问</label>
      </div>
      <div id="status"></div>
      <div id="remoteInfo">
        <div id="qr"></div>
        <div id="urlRow">
          <div id="url"></div>
          <button class="btn" id="copyBtn">复制</button>
        </div>
      </div>
      <div id="hint"></div>
      <div id="err"></div>
      <button class="btn secondary" id="fwBtn" style="display: none; margin-bottom: 14px">
        手机连不上？允许防火墙访问
      </button>
      <button class="btn secondary" id="backBtn">返回</button>
    </div>
    <script>
      const { invoke } = window.__TAURI__.core;
      const $ = (id) => document.getElementById(id);

      // 界面语言跟随系统语言（仅中/英）
      const zh = (navigator.language || "en").toLowerCase().startsWith("zh");
      document.documentElement.lang = zh ? "zh-CN" : "en";
      const T = zh
        ? {
            title: "远程控制（局域网）",
            enable: "启用远程访问",
            off: "未开启，仅本机可访问",
            on: "已开启，手机扫码或访问下方链接",
            restarting: "正在重启服务…",
            copy: "复制",
            copied: "已复制",
            back: "返回",
            fw: "手机连不上？允许防火墙访问",
            fwWorking: "等待管理员授权…",
            fwOk: "已允许，手机现在可以连接了",
            fwFail: "仍无法连通，请手动检查 Windows 防火墙",
            hint: "手机需与电脑连接同一 WiFi。链接内的 token 是唯一鉴权手段，谁拿到链接谁就能控制，请勿在公共网络开启。",
          }
        : {
            title: "Remote Control (LAN)",
            enable: "Enable remote access",
            off: "Off. This machine only.",
            on: "On. Scan the QR code or open the link on your phone",
            restarting: "Restarting service…",
            copy: "Copy",
            copied: "Copied",
            back: "Back",
            fw: "Phone can't connect? Allow through firewall",
            fwWorking: "Waiting for admin approval…",
            fwOk: "Allowed. Your phone can connect now",
            fwFail: "Still unreachable. Please check Windows Firewall manually",
            hint: "Your phone must be on the same WiFi as this computer. The token in the link is the only credential — anyone with the link gets full control, so do not enable this on public networks.",
          };

      function render(st) {
        const toggle = $("toggle");
        toggle.disabled = false;
        toggle.checked = st.enabled;
        $("status").textContent = st.enabled ? T.on : T.off;
        if (st.enabled && st.url) {
          $("remoteInfo").style.display = "flex";
          $("qr").innerHTML = st.qr_svg || "";
          $("url").textContent = st.url;
          $("fwBtn").style.display = "";
        } else {
          $("remoteInfo").style.display = "none";
          $("fwBtn").style.display = "none";
          if (st.enabled) $("status").textContent = T.restarting;
        }
      }

      async function load() {
        try {
          render(await invoke("get_remote_state"));
        } catch (e) {
          $("err").textContent = String(e);
        }
      }

      $("toggle").onchange = async (e) => {
        const toggle = $("toggle");
        toggle.disabled = true;
        $("err").textContent = "";
        $("status").textContent = T.restarting;
        try {
          render(await invoke("set_remote_enabled", { enabled: e.target.checked }));
        } catch (err) {
          $("err").textContent = String(err);
          toggle.disabled = false;
          load(); // 失败则按实际状态回刷
        }
      };

      $("copyBtn").onclick = async () => {
        try {
          await navigator.clipboard.writeText($("url").textContent);
          $("copyBtn").textContent = T.copied;
          setTimeout(() => ($("copyBtn").textContent = T.copy), 1500);
        } catch (e) {
          $("err").textContent = String(e);
        }
      };

      $("backBtn").onclick = () => invoke("show_webui").catch((e) => ($("err").textContent = String(e)));

      $("fwBtn").onclick = async () => {
        const btn = $("fwBtn");
        btn.disabled = true;
        $("err").style.color = "#9a9a9a";
        $("err").textContent = T.fwWorking;
        try {
          const ok = await invoke("allow_firewall");
          $("err").style.color = ok ? "#7bc98f" : "#f0928e";
          $("err").textContent = ok ? T.fwOk : T.fwFail;
        } catch (e) {
          $("err").style.color = "#f0928e";
          $("err").textContent = String(e);
        }
        btn.disabled = false;
      };

      window.addEventListener("DOMContentLoaded", () => {
        $("title").textContent = T.title;
        $("toggleLabel").textContent = T.enable;
        $("copyBtn").textContent = T.copy;
        $("backBtn").textContent = T.back;
        $("fwBtn").textContent = T.fw;
        $("hint").textContent = T.hint;
        load();
      });
    </script>
  </body>
</html>

[package]
name = "kimicode-webui-desktop"
version = "0.1.0"
description = "Kimi Code WebUI wrapped in a Tauri desktop app"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
opt-level = "s"
panic = "abort"
strip = true
